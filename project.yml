name: Gibbon
options:
  bundleIdPrefix: com.alek
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3S4B6R8456
    ENABLE_PREVIEWS: YES
targets:
  Gibbon:
    type: application
    platform: iOS
    sources:
      - path: Gibbon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alek.gibbon
        PRODUCT_NAME: Gibbon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "White Cheeked Gibbon"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "White Cheeked Gibbon uses the camera to photograph meals, scan barcodes and read nutrition labels."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "White Cheeked Gibbon lets you pick meal and progress photos from your library."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
